<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Store</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <h1>My Store</h1>
    <div class="filter-buttons">
        <input type="text" placeholder="search for product" id="product-title">
        <label for="filterId"></label>
        <select name="category" id="filterId">

        </select>
        <input type="number" placeholder="Min Price" id="min-price">
        <input type="number" placeholder="Max Price" id="max-price">
        <button class="apply-filter" type="button">Apply Filter</button>
    </div>
    <div class="sort">
        <label for="sortId"></label>
        <select name="sort-by" id="sortId">
            <option value="name" id="name-sort">Sort by Name</option>
            <option value="price" id="price-sort">Sort by Price</option>
            <option value="rating" id="rating-sort">Sort by Rating</option>
        </select>
    </div>

    <div class="cart-summary" id="cart-summary">
        <h2>Shopping Cart</h2>
        <p>Total Quantity: <span id="cart-quantity">0</span></p>
        <p>Total Price: <span id="cart-total">$0.00</span></p>
        <div id="cart-items" class="cart-items"></div>
    </div>

    <div class="products"></div>

    <div id="product-modal" class="modal hidden">
        <div class="modal-content">
            <button class="close-modal" type="button" aria-label="Close product details">×</button>
            <img id="modal-image" src="" alt="Product image">
            <h3 id="modal-title"></h3>
            <p id="modal-category"></p>
            <p id="modal-price"></p>
            <p id="modal-rating"></p>
            <p id="modal-description"></p>
        </div>
    </div>

    <script src="./index.js"></script>
</body>
</html>
